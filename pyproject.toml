[build-system]
requires = [
    "setuptools>=67.6.0",
    "wheel>=0.40.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "easy-time-tracker"

dynamic = ["readme"]
version = "0.1.0"

requires-python = ">=3.12"
description = "Easy Time Tracking"
keywords = [
]
authors = [
  { name="Benjamin P. Trachtenberg", email="e_ben_75-python@yahoo.com" },
]
maintainers = [
  {name = "Benjamin P. Trachtenberg", email = "e_ben_75-python@yahoo.com"},
]
license = "MIT"
license-files = [
    "LICENSE"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: BSD",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",]

dependencies = [
    "pydantic",
    "pandas",
    "openpyxl",
]

[dependency-groups]
dev = [
    "black",
    "tomli; python_version < '3.11'",
    "pytest-cov",
    "sphinx",
    "pylint",
    "myst-parser",
    "sphinx_rtd_theme",
    "sphinxcontrib-mermaid",
    "httpx",
    "bandit",
    "mypy",
    "complexipy>=7.0.1",
]


[project.urls]
Documentation = "https://easy-time-tracker.readthedocs.io/en/latest/"
Source = "https://github.com/btr1975/easy-time-tracker"
Tracker = "https://github.com/btr1975/easy-time-tracker/issues"

[project.scripts]
ett = "easy_time_tracker.cli:cli"

[tool.setuptools.packages.find]
include = [
    "easy_time_tracker*",
]

# Add or remove file extensions to include the data
[tool.setuptools.package-data]
"*" = ["*.html", "*.md", "*.jinja2"]

[tool.setuptools]
zip-safe = false

[tool.setuptools.dynamic]
readme = {file = "README.md", content-type = "text/markdown"}


[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "place_holder: marks tests as place_holder (deselect with -m 'not place_holder')",
]

[tool.coverage.run]
command_line= "-m pytest -vvv"

[tool.coverage.report]
include = [
    "easy_time_tracker/*"
]
fail_under = 70

[tool.pylint]
max-line-length = 120
# This allows pylint to complain on FIXME and XXX notes
notes = [
    "FIXME",
    "XXX",
]
disable = [
]
fail-under = 9.9

[tool.black]
line-length = 120
target-version = [
    "py312",
]

[tool.bandit]
exclude_dirs = [
    "tests",
    "venv",
    "docs",
]

[tool.mypy]
python_version = "3.12"

[tool.complexipy]
paths = ["easy_time_tracker", "tests"]
max-complexity-allowed = 15
snapshot-create = false
snapshot-ignore = false
failed = false
quiet = false
ignore-complexity = false
color = "auto"
sort = "asc"
exclude = []
check-script = false
no-ignore = false
report-ignored = false
output-format = ["json"]
output = "complexipy-results.json"

# UV settings reference https://docs.astral.sh/uv/reference/settings/

[tool.uv]
keyring-provider = "subprocess"
system-certs = true

